<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — MazeQuest</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-icon">👤</div>
    <h1>Join MazeQuest</h1>
    <p class="subtitle">Start your learning adventure today</p>

    <form id="registerForm" class="auth-form">
      <label>Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username" required />

      <label>Email</label>
      <input type="email" id="regEmail" placeholder="your@email.com" required />

      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min. 6 characters" required minlength="6" />

      <label>Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="Confirm your password" required />

      <div id="regError" style="color:#ff6b6b; font-size:12px; margin-top:6px;"></div>
      <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const err = document.getElementById('regError');
      err.textContent = '';
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const confirm = document.getElementById('regConfirm').value.trim();

      if (!username || !email || !password || !confirm) {
        err.textContent = 'All fields are required.';
        return;
      }
      if (password !== confirm) {
        err.textContent = "Passwords don't match.";
        return;
      }
      try {
        const form = new FormData();
        form.append('username', username);
        form.append('email', email);
        form.append('password', password);
        form.append('confirm', confirm);
        const res = await fetch('register.php', { method: 'POST', body: form });
        const data = await res.json();
        if (data.success) {
          alert('✅ Account created successfully! Please log in.');
          window.location.href = 'login.html';
        } else {
          err.textContent = data.message || 'Registration failed.';
        }
      } catch (e2) {
        err.textContent = 'Server error. Please try again.';
      }
    });
  </script>

</body>
</html>
