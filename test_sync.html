<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Database Sync</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    button:hover { background: #0056b3; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
    .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🔧 MazeQuest Database Sync Test</h1>
  
  <div class="test-section">
    <h2>1. Session Status</h2>
    <button onclick="checkSession()">Check Login Status</button>
    <div id="sessionStatus"></div>
  </div>

  <div class="test-section">
    <h2>2. Test Database Sync</h2>
    <button onclick="testSync()">Test Sync Profile</button>
    <div id="syncStatus"></div>
  </div>

  <div class="test-section">
    <h2>3. Current User Data (localStorage)</h2>
    <button onclick="showLocalData()">Show Local Data</button>
    <div id="localData"></div>
  </div>

  <div class="test-section">
    <h2>4. Database User Data</h2>
    <button onclick="loadFromDB()">Load from Database</button>
    <div id="dbData"></div>
  </div>

  <script>
    async function checkSession() {
      const statusDiv = document.getElementById('sessionStatus');
      try {
        const res = await fetch('user_profile.php', { credentials: 'same-origin' });
        const data = await res.json();
        
        if (data.success) {
          statusDiv.innerHTML = `
            <div class="status success">
              <strong>✅ You are logged in!</strong><br>
              User ID: ${data.user.username}<br>
              Email: ${data.user.email}
            </div>
          `;
        } else {
          statusDiv.innerHTML = `
            <div class="status error">
              <strong>❌ Not logged in</strong><br>
              Message: ${data.message}<br>
              <br>
              <a href="login.html">Go to Login Page</a>
            </div>
          `;
        }
      } catch(e) {
        statusDiv.innerHTML = `
          <div class="status error">
            <strong>❌ Backend Error</strong><br>
            ${e.message}
          </div>
        `;
      }
    }

    async function testSync() {
      const statusDiv = document.getElementById('syncStatus');
      statusDiv.innerHTML = '<div class="status info">Testing sync...</div>';
      
      try {
        const form = new FormData();
        form.append('coins', 999);
        form.append('level', 10);
        form.append('xp', 500);
        form.append('streak', 5);
        
        const res = await fetch('sync_profile.php', { 
          method: 'POST', 
          body: form, 
          credentials: 'same-origin'
        });
        
        const data = await res.json();
        
        if (data.success) {
          statusDiv.innerHTML = `
            <div class="status success">
              <strong>✅ Sync Successful!</strong><br>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        } else {
          statusDiv.innerHTML = `
            <div class="status error">
              <strong>❌ Sync Failed</strong><br>
              Message: ${data.message}<br>
              ${data.message === 'Not authenticated' ? '<br><a href="login.html">Go to Login Page</a>' : ''}
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }
      } catch(e) {
        statusDiv.innerHTML = `
          <div class="status error">
            <strong>❌ Error</strong><br>
            ${e.message}
          </div>
        `;
      }
    }

    function showLocalData() {
      const dataDiv = document.getElementById('localData');
      try {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
          dataDiv.innerHTML = `
            <div class="status info">
              <pre>${JSON.stringify(user, null, 2)}</pre>
            </div>
          `;
        } else {
          dataDiv.innerHTML = `
            <div class="status error">
              No user data in localStorage
            </div>
          `;
        }
      } catch(e) {
        dataDiv.innerHTML = `
          <div class="status error">
            Error: ${e.message}
          </div>
        `;
      }
    }

    async function loadFromDB() {
      const dataDiv = document.getElementById('dbData');
      dataDiv.innerHTML = '<div class="status info">Loading from database...</div>';
      
      try {
        const res = await fetch('user_profile.php', { credentials: 'same-origin' });
        const data = await res.json();
        
        if (data.success) {
          dataDiv.innerHTML = `
            <div class="status success">
              <strong>✅ Database Data:</strong>
              <pre>${JSON.stringify(data.user, null, 2)}</pre>
            </div>
          `;
        } else {
          dataDiv.innerHTML = `
            <div class="status error">
              <strong>❌ Failed to load</strong><br>
              Message: ${data.message}
            </div>
          `;
        }
      } catch(e) {
        dataDiv.innerHTML = `
          <div class="status error">
            Error: ${e.message}
          </div>
        `;
      }
    }

    // Auto-check session on load
    window.onload = function() {
      checkSession();
    };
  </script>
</body>
</html>
